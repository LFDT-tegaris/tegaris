name: Documentation

# Always report this lightweight check so branch protection can require it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    name: Required documents and local links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test documentation checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/docs -p 'test_*.py' -v
      - name: Check documentation
        run: python3 scripts/docs/check-docs.py
