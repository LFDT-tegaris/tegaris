name: Migration readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-readiness:
    name: Portable setup and recovery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Test synthetic setup, sign-in, RPC evidence and recovery contracts
        run: bash scripts/migrations/run-portable-readiness.sh

  native-capacity:
    name: Inspect disposable Linux proof capacity
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      admitted: ${{ steps.capacity.outputs.admitted }}
      custody: ${{ steps.capacity.outputs.custody }}
    steps:
      - name: Check actual memory and disk without starting a workload
        id: capacity
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          available_kib = int(next(line.split()[1] for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))
          free_bytes = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          # This is only a scheduling probe. The workload's own bounded runner
          # rechecks its actual machine and retains the 50 GiB disk reserve.
          admitted = available_kib >= 6 * 1024**2 and free_bytes >= 64 * 1024**3
          # Only a scheduling estimate: the custody job may remove these
          # unused SDKs from its own fresh GitHub VM, then must recheck space.
          reclaimable = 0
          for name in ('/usr/share/dotnet', '/usr/local/lib/android'):
              path = pathlib.Path(name)
              if path.is_dir() and not path.is_symlink():
                  result = subprocess.run(['du', '-sx', '--block-size=1', name], text=True, capture_output=True)
                  if result.returncode == 0 and result.stdout.split() and result.stdout.split()[0].isdigit():
                      reclaimable += int(result.stdout.split()[0])
          custody = available_kib >= 12 * 1024**2 and free_bytes + reclaimable >= 100 * 1024**3
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('admitted=' + str(admitted).lower() + '\n')
              output.write('custody=' + str(custody).lower() + '\n')
          print(f'Available memory: {available_kib / 1024**2:.1f} GiB; free disk: {free_bytes / 1024**3:.1f} GiB; unused SDK estimate: {reclaimable / 1024**3:.1f} GiB; native={admitted}; custody_candidate={custody}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Available memory: {available_kib / 1024**2:.1f} GiB; free disk: {free_bytes / 1024**3:.1f} GiB.\n\n')
              summary.write('Native proof may be scheduled; actual admission is checked again.\n' if admitted else 'Native database proof skipped: insufficient capacity. This is not a passing database or full-stack qualification.\n')
              summary.write('\nCustody component tests may be scheduled; actual admission is checked again.\n' if custody else '\nCustody component tests skipped: insufficient capacity. Full setup and demo checks remain required.\n')
          PY

  native-baseline:
    name: Isolated Linux PostgreSQL baseline proof
    needs: [portable-readiness, native-capacity]
    if: needs.native-capacity.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENPC_SYSTEM_SCOPE: 1
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep curl ca-certificates build-essential bison flex libssl-dev zlib1g-dev locales && sudo locale-gen en_US.UTF-8
      - name: Run bounded proof in a new external directory
        run: bash scripts/maintenance/run-project.sh --profile database -- bash scripts/migrations/run-linux-proof.sh "$RUNNER_TEMP/tegaris-baseline"

  source-custody:
    name: Isolated compact baseline source and archive custody
    needs: [portable-readiness, native-capacity]
    if: needs.native-capacity.outputs.custody == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENPC_SYSTEM_SCOPE: 1
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Prepare disk on this fresh GitHub custody VM
        env:
          TEGARIS_RUNNER_KIND: ${{ runner.environment }}
        run: |
          [[ "$GITHUB_ACTIONS" == true && "$TEGARIS_RUNNER_KIND" == github-hosted && "$RUNNER_OS" == Linux ]] || exit 78
          for sdk in /usr/share/dotnet /usr/local/lib/android; do
            [[ ! -L "$sdk" ]] || exit 78
            sudo rm -rf --one-file-system -- "$sdk"
          done
          python3 - <<'PY'
          import pathlib, shutil
          available_kib = int(next(line.split()[1] for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))
          free_bytes = shutil.disk_usage('.').free
          print(f'Custody admission precheck: {available_kib / 1024**2:.1f} GiB memory, {free_bytes / 1024**3:.1f} GiB free disk')
          if available_kib < 12 * 1024**2 or free_bytes < 100 * 1024**3:
              raise SystemExit('Insufficient custody capacity after VM preparation; no test workload started')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: Install test prerequisites
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Prepare private test scratch
        run: |
          echo "OPENPC_LOCAL_RUNTIME_TMP_ROOT=$RUNNER_TEMP/tegaris-custody" >> "$GITHUB_ENV"
          echo "OPENPC_TEST_TMP_ROOT=$RUNNER_TEMP/tegaris-tests" >> "$GITHUB_ENV"
          echo "OPENPC_PNC_TMP_ROOT=$RUNNER_TEMP/tegaris-pnc" >> "$GITHUB_ENV"
          echo "pnpm_config_cache_dir=$RUNNER_TEMP/tegaris-pnpm-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tegaris-custody" "$RUNNER_TEMP/tegaris-tests" "$RUNNER_TEMP/tegaris-pnc"
      - name: Install locked dependencies under resource admission
        run: bash scripts/maintenance/run-project.sh --memory-gib 8 --peak-disk-gib 40 -- pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies
      # Fail database setup early, before spending time on the native build.
      - name: Fresh control installation, repeat and restart
        run: bash scripts/maintenance/run-project.sh --profile database -- bash tests/integration/identity/run-participant-readback.sh tests/integration/local-runtime/control-installation.test.mjs
      - name: Fetch locked native dependencies under resource admission
        run: bash scripts/maintenance/run-project.sh --memory-gib 8 --peak-disk-gib 40 -- cargo fetch --locked
      - name: Qualify actual runtime source and archive custody
        run: bash scripts/migrations/run-linux-custody.sh
