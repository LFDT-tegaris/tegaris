[workspace]
resolver = "2"
members = ["crates/*", "services/*"]
exclude = ["services/control-api", "services/identity-service", "services/participant-service", "services/module-registry"]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
version = "2.0.0"
license = "Apache-2.0"

[workspace.dependencies]
tokio = "=1.53.1"
serde = "=1.0.229"
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
tracing-opentelemetry = "=0.33.0"
opentelemetry = "=0.32.0"
opentelemetry-otlp = "=0.32.0"
config = "=0.15.25"
secrecy = "=0.10.3"
zeroize = "=1.9.0"
uuid = "=1.26.0"
time = "=0.3.55"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
axum = "=0.8.9"
tower = "=0.5.3"
tower-http = "=0.7.0"
hyper = "=1.11.0"
reqwest = "=0.13.4"
rustls = "=0.23.43"
sqlx = "=0.9.0"
sha2 = "=0.11.0"
hmac = "=0.13.0"
base64ct = "=1.8.3"
ciborium = "=0.2.2"
coset = "=0.4.2"
p256 = "=0.14.0"
k256 = "=0.14.0"
