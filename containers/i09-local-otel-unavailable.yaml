receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 100ms
    limit_mib: 64
    spike_limit_mib: 16
  batch:
    timeout: 100ms
    send_batch_size: 1
    send_batch_max_size: 1
exporters:
  otlphttp/unavailable:
    endpoint: http://127.0.0.1:65534
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 2
    retry_on_failure:
      enabled: true
      initial_interval: 100ms
      max_interval: 200ms
      max_elapsed_time: 1s
service:
  telemetry:
    logs:
      level: warn
      encoding: json
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/unavailable]
