name: openpc-local

x-postgres: &postgres
  image: docker.io/library/postgres:18.6@sha256:7341002d2b8c7c5bdd7542a671a95b36196c0b5b888daf454ae4fc33ba5346d7
  platform: linux/amd64
  restart: unless-stopped
  # Reap orphaned exec/health-check children outside the postmaster. PostgreSQL
  # treats an unknown signaled child as a crash and restarts all its backends.
  init: true
  security_opt: [no-new-privileges:true]
  cpus: 0.75
  mem_limit: 1g
  pids_limit: 256
  networks: [openpc-local]

x-postgres-final-healthcheck: &postgres-final-healthcheck
  test: ["CMD", "sh", "/postgres_final_healthcheck"]
  interval: 2s
  timeout: 3s
  retries: 30

services:
  oidc-emulator:
    image: docker.io/library/node:24.19.0-alpine@sha256:2a49bdf71e9fd965a58c1703fd9ddd205b34e5782b692a72dd1d248abb0beb43
    platform: linux/amd64
    command: ["node", "/app/server.mjs"]
    environment:
      OIDC_EMULATOR_ISSUER: http://oidc-emulator:3006
      OIDC_EMULATOR_PRINCIPAL_ID: 018f0000-0000-7000-8000-000000000111
      OIDC_EMULATOR_VIEWER_PRINCIPAL_ID: 018f0000-0000-7000-8000-000000000112
      OIDC_EMULATOR_PARTICIPANT_ID: 018f0000-0000-7000-8000-000000000101
    ports: ["127.0.0.1:53006:3006"]
    volumes: ["../../../tests/integration/local-runtime/oidc-emulator.mjs:/app/server.mjs:ro"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    networks: [openpc-local]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-pg:
    <<: *postgres
    mem_limit: ${OPENPC_LOCAL_CONTROL_PG_MEMORY:-1g}
    memswap_limit: ${OPENPC_LOCAL_CONTROL_PG_SWAP:-2g}
    cpus: ${OPENPC_LOCAL_CONTROL_PG_CPUS:-0.75}
    # Nested authority and RLS checks are short transactional queries; LLVM
    # compilation costs more than their execution in this bounded local profile.
    command: ["postgres", "-c", "jit=off"]
    environment:
      POSTGRES_DB: openpc_control
      POSTGRES_USER: openpc_control
      POSTGRES_PASSWORD_FILE: /run/secrets/control_pg_password
      # Return large, transient RLS planning allocations under the 1 GiB cap.
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["${OPENPC_LOCAL_DATA_ROOT:?}/control-pg:/var/lib/postgresql"]
    secrets: [control_pg_password]
    configs: [postgres_final_healthcheck]
    healthcheck: *postgres-final-healthcheck

  fact-pg:
    <<: *postgres
    environment:
      POSTGRES_DB: openpc_facts
      POSTGRES_USER: openpc_facts
      POSTGRES_PASSWORD_FILE: /run/secrets/fact_pg_password
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["${OPENPC_LOCAL_DATA_ROOT:?}/fact-pg:/var/lib/postgresql"]
    secrets: [fact_pg_password]
    configs: [postgres_final_healthcheck]
    healthcheck: *postgres-final-healthcheck

  candidate-index-pg:
    <<: *postgres
    environment:
      POSTGRES_DB: openpc_candidate_index
      POSTGRES_USER: openpc_candidate_index
      POSTGRES_PASSWORD_FILE: /run/secrets/candidate_index_pg_password
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["${OPENPC_LOCAL_DATA_ROOT:?}/candidate-index-pg:/var/lib/postgresql"]
    secrets: [candidate_index_pg_password]
    configs: [postgres_final_healthcheck]
    healthcheck: *postgres-final-healthcheck

  control-migrate:
    <<: *postgres
    restart: "no"
    entrypoint: ["/bin/sh", "/local/migrate.sh", "control"]
    environment:
      PGHOST: control-pg
      PGUSER: openpc_control
      PGDATABASE: openpc_control
    volumes:
      - ../../../migrations/postgres:/migrations/postgres:ro
      - ./migrate.sh:/local/migrate.sh:ro
    secrets: [control_pg_password, identity_runtime_db_password, participant_runtime_db_password, policy_runtime_db_password, control_api_runtime_db_password, control_worker_runtime_db_password, source_control_db_password, fleet_fact_admission_key, runtime_target_disposition_key]
    depends_on:
      control-pg: { condition: service_healthy }

  fact-migrate:
    <<: *postgres
    restart: "no"
    entrypoint: ["/bin/sh", "/local/migrate.sh", "fact"]
    environment:
      PGHOST: fact-pg
      PGUSER: openpc_facts
      PGDATABASE: openpc_facts
    volumes:
      - ../../../migrations/postgres:/migrations/postgres:ro
      - ./migrate.sh:/local/migrate.sh:ro
    secrets: [fact_pg_password, fact_capability_secret, fact_runtime_db_password, policy_fact_db_password]
    depends_on:
      fact-pg: { condition: service_healthy }

  candidate-index-migrate:
    <<: *postgres
    restart: "no"
    entrypoint: ["/bin/sh", "/local/migrate.sh", "candidate_index"]
    environment:
      PGHOST: candidate-index-pg
      PGUSER: openpc_candidate_index
      PGDATABASE: openpc_candidate_index
    volumes:
      - ../../../migrations/postgres:/migrations/postgres:ro
      - ./migrate.sh:/local/migrate.sh:ro
    secrets: [candidate_index_pg_password, indexer_manager_db_password, indexer_writer_db_password, fact_bridge_reader_db_password, candidate_index_reader_db_password, candidate_retirement_capability_secret]
    depends_on:
      candidate-index-pg: { condition: service_healthy }

  identity-service:
    image: openpc-r1-dev/identity-service:local
    build:
      labels:
        io.openpc.image.owner: openpc-r1-local-runtime-v1
        io.openpc.image.service: identity-service
      context: ../../..
      dockerfile: services/identity-service/Dockerfile
    platform: linux/amd64
    ports: ["127.0.0.1:53443:3443", "127.0.0.1:53444:3444"]
    environment:
      OPENPC_LOCAL_RUNTIME: "1"
      OPENPC_LOCAL_RUNTIME_QA_FIXTURE: ${OPENPC_LOCAL_RUNTIME_QA_FIXTURE:-0}
      IDENTITY_LOCAL_QA_RUNTIME_SNAPSHOT_TTL_MS: ${OPENPC_LOCAL_RUNTIME_QA_SNAPSHOT_TTL_MS:-60000}
      IDENTITY_RECOVERY_LEASE_TTL_MS: ${IDENTITY_RECOVERY_LEASE_TTL_MS:-900000}
      IDENTITY_RECOVERY_ADMINISTRATOR_TTL_MS: ${IDENTITY_RECOVERY_ADMINISTRATOR_TTL_MS:-3600000}
      IDENTITY_DATABASE_HOST: control-pg
      IDENTITY_DATABASE_PORT: "5432"
      IDENTITY_DATABASE_NAME: openpc_control
      IDENTITY_DATABASE_USER: openpc_identity_runtime
      IDENTITY_DATABASE_PASSWORD_FILE: /run/secrets/identity_runtime_db_password
      IDENTITY_INTERNAL_TOKEN_FILE: /run/secrets/identity_internal_token
      IDENTITY_RUNTIME_SIGNING_PRIVATE_KEY_FILE: /run/secrets/identity_runtime_signing_private_key
      IDENTITY_RUNTIME_SIGNING_PUBLIC_KEY_FILE: /run/secrets/identity_runtime_signing_public_key
      IDENTITY_RUNTIME_TRUSTED_PUBLIC_KEY_FILES: /run/secrets/identity_runtime_signing_public_key
      IDENTITY_LOCAL_OPERATOR_CREDENTIAL_FILE: /run/secrets/local_operator_credential
      IDENTITY_LOCAL_VIEWER_CREDENTIAL_FILE: /run/secrets/local_viewer_credential
      IDENTITY_LOCAL_OPERATOR_PRINCIPAL_ID: 018f0000-0000-7000-8000-000000000111
      IDENTITY_LOCAL_VIEWER_PRINCIPAL_ID: 018f0000-0000-7000-8000-000000000112
      IDENTITY_LOCAL_PARTICIPANT_ID: 018f0000-0000-7000-8000-000000000101
      IDENTITY_LOCAL_PRIVACY_DOMAIN_ID: 018f0000-0000-7000-8000-000000000201
      IDENTITY_OIDC_ISSUER: http://oidc-emulator:3006
      IDENTITY_OIDC_CLIENT_ID: openpc-local-workbench
      IDENTITY_OIDC_REDIRECT_URI: http://localhost:8080/api/v1/ui/oidc-session/callback
      IDENTITY_SIGNING_CONTINUATION_CLIENT_CA_FILE: /run/secrets/business_provider_ca
      IDENTITY_SIGNING_CONTINUATION_LISTEN: 0.0.0.0:3444
      IDENTITY_SIGNING_CONTINUATION_PRIVATE_KEY_FILE: /run/secrets/identity_continuation_private_key
      IDENTITY_SIGNING_CONTINUATION_PUBLIC_KEY_FILE: /run/secrets/identity_continuation_public_key
      IDENTITY_SIGNING_CONTINUATION_TRUSTED_PUBLIC_KEY_FILES: /run/secrets/identity_continuation_public_key
      IDENTITY_MTLS_CA_FILE: /run/secrets/identity_mtls_ca
      IDENTITY_WORKLOAD_ISSUER_URL: http://workload-issuer:3008/v1/certificates
      IDENTITY_WORKLOAD_ISSUER_TOKEN_FILE: /run/secrets/workload_issuer_token
      IDENTITY_MTLS_SERVER_CERT_FILE: /run/secrets/identity_mtls_server_cert
      IDENTITY_MTLS_SERVER_KEY_FILE: /run/secrets/identity_mtls_server_key
      IDENTITY_MTLS_LISTEN: 0.0.0.0:3443
      IDENTITY_LISTEN: 0.0.0.0:3001
    secrets:
      - identity_runtime_db_password
      - identity_internal_token
      - identity_continuation_private_key
      - identity_continuation_public_key
      - identity_runtime_signing_private_key
      - identity_runtime_signing_public_key
      - local_operator_credential
      - local_viewer_credential
      - identity_mtls_ca
      - workload_issuer_token
      - business_provider_ca
      - identity_mtls_server_cert
      - identity_mtls_server_key
    depends_on:
      control-migrate: { condition: service_completed_successfully }
      oidc-emulator: { condition: service_healthy }
      workload-issuer: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 256
    networks: [openpc-local]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  participant-service:
    image: openpc-r1-dev/participant-service:local
    build:
      labels:
        io.openpc.image.owner: openpc-r1-local-runtime-v1
        io.openpc.image.service: participant-service
      context: ../../..
      dockerfile: services/participant-service/Dockerfile
    platform: linux/amd64
    ports: ["127.0.0.1:53005:3005"]
    environment:
      OPENPC_LOCAL_RUNTIME: "1"
      OPENPC_LOCAL_RUNTIME_QA_FIXTURE: ${OPENPC_LOCAL_RUNTIME_QA_FIXTURE:-0}
      PARTICIPANT_DATABASE_HOST: control-pg
      PARTICIPANT_DATABASE_PORT: "5432"
      PARTICIPANT_DATABASE_NAME: openpc_control
      PARTICIPANT_DATABASE_USER: openpc_participant_runtime
      PARTICIPANT_DATABASE_PASSWORD_FILE: /run/secrets/participant_runtime_db_password
      PARTICIPANT_IDENTITY_URL: http://identity-service:3001
      PARTICIPANT_IDENTITY_RUNTIME_TRUSTED_PUBLIC_KEY_FILES: /run/secrets/identity_runtime_signing_public_key
      PARTICIPANT_IDENTITY_INTERNAL_TOKEN_FILE: /run/secrets/identity_internal_token
      PARTICIPANT_LOCAL_PRIVACY_DOMAIN_ID: 018f0000-0000-7000-8000-000000000201
      PARTICIPANT_ENVELOPE_SIGNING_PROVIDER_URL: https://signing-provider:3007
      PARTICIPANT_ENVELOPE_SIGNING_PROVIDER_CA_FILE: /run/secrets/business_provider_ca
      PARTICIPANT_ENVELOPE_SIGNING_PROVIDER_CERT_FILE: /run/secrets/business_api_cert
      PARTICIPANT_ENVELOPE_SIGNING_PROVIDER_KEY_FILE: /run/secrets/business_api_key
      PARTICIPANT_ENVELOPE_SIGNING_PROVIDER_SERVER_CERT_FILE: /run/secrets/business_provider_server_cert
      PARTICIPANT_ENVELOPE_SIGNING_ENVIRONMENT_ID: local
      PARTICIPANT_ENVELOPE_SIGNING_CALLER_CREDENTIAL_ID: 018f0000-0000-7000-8000-000000000195
      PARTICIPANT_LISTEN: 0.0.0.0:3005
    secrets: [participant_runtime_db_password, identity_internal_token, identity_runtime_signing_public_key, business_provider_ca, business_provider_server_cert, business_api_cert, business_api_key]
    depends_on:
      control-migrate: { condition: service_completed_successfully }
      identity-service: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 256
    networks: [openpc-local]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-api:
    image: openpc-r1-dev/control-api:local
    env_file:
      - path: "${OPENPC_LOCAL_DATA_ROOT:?}/protected-proofs/control.env"
        required: false
      - path: "${OPENPC_LOCAL_DATA_ROOT:?}/privacy-explorer/control.env"
        required: false
    build:
      labels:
        io.openpc.image.owner: openpc-r1-local-runtime-v1
        io.openpc.image.service: control-api
      context: ../../..
      dockerfile: services/control-api/Dockerfile
    platform: linux/amd64
    ports: ["127.0.0.1:53003:3003"]
    environment:
      OPENPC_LOCAL_RUNTIME: "1"
      OPENPC_LOCAL_RUNTIME_QA_FIXTURE: ${OPENPC_LOCAL_RUNTIME_QA_FIXTURE:-0}
      OPENPC_LOCAL_QA_INITIAL_POLICY_RENEWAL_ENVELOPE_IDS: ${OPENPC_LOCAL_QA_INITIAL_POLICY_RENEWAL_ENVELOPE_IDS:-}
      CONTROL_API_MODULE_RELEASE_CATALOG_FILE: /app/module-releases/catalog.json
      CONTROL_API_MODULE_RELEASE_TRUST_FILE: /app/module-releases/trust.json
      CONTROL_API_DATABASE_HOST: control-pg
      CONTROL_API_DATABASE_PORT: "5432"
      CONTROL_API_DATABASE_NAME: openpc_control
      CONTROL_API_DATABASE_USER: openpc_configuration_runtime
      CONTROL_API_DATABASE_PASSWORD_FILE: /run/secrets/control_api_runtime_db_password
      POLICY_FACT_DATABASE_HOST: fact-pg
      POLICY_FACT_DATABASE_PORT: "5432"
      POLICY_FACT_DATABASE_NAME: openpc_facts
      POLICY_FACT_DATABASE_USER: openpc_policy_fact_runtime
      POLICY_FACT_DATABASE_PASSWORD_FILE: /run/secrets/policy_fact_db_password
      POLICY_FACT_VERIFY_KEY_FILE: /run/secrets/policy_fact_verify_key
      POLICY_FACT_VERIFY_KEY_ID: sha256:6bd1b7ff42169210dab9f9a28055f450b422a47834ff4e68e8c2de9d54804efc
      CONTROL_API_FACT_URL: http://fact-service:8081
      CONTROL_API_FACT_INTERNAL_TOKEN_FILE: /run/secrets/fact_internal_token
      CONTROL_API_IDENTITY_URL: http://identity-service:3001
      CONTROL_API_IDENTITY_RUNTIME_TRUSTED_PUBLIC_KEY_FILES: /run/secrets/identity_runtime_signing_public_key
      OPENPC_DEPLOYMENT_PROJECTION_PUBLIC_KEY_FILE: /run/secrets/runtime_agent_projection_public_key
      OPENPC_CIGL_ANALYSIS_TARGET_KEYS_FILE: /run/secrets/runtime_analysis_target_keys
      OPENPC_CIGL_PROFILE_PUBLIC_KEY_FILE: /run/secrets/fleet_deployment_rejection_public_key
      OPENPC_DEPLOYMENT_REJECTION_PUBLIC_KEY_FILE: /run/secrets/fleet_deployment_rejection_public_key
      CONTROL_API_SIGNING_CONTINUATION_TRUSTED_PUBLIC_KEY_FILES: /run/secrets/identity_continuation_public_key
      CONTROL_API_SIGNING_CONTINUATION_URL: https://identity-service:3444
      CONTROL_API_SIGNING_CONTINUATION_CA_FILE: /run/secrets/identity_mtls_ca
      CONTROL_API_SIGNING_FINALIZER_ENABLED: "${OPENPC_LOCAL_RUNTIME_SIGNING_FINALIZER_ENABLED:-1}"
      CONTROL_API_LOCAL_PARTICIPANT_ID: 018f0000-0000-7000-8000-000000000101
      CONTROL_API_SIGNING_PROVIDER_URL: https://signing-provider:3007
      CONTROL_API_SIGNING_PROVIDER_CA_FILE: /run/secrets/business_provider_ca
      CONTROL_API_SIGNING_PROVIDER_CERT_FILE: /run/secrets/business_api_cert
      CONTROL_API_SIGNING_PROVIDER_KEY_FILE: /run/secrets/business_api_key
      CONTROL_API_SIGNING_LIFECYCLE_CREDENTIAL_ID: 018f0000-0000-7000-8000-000000000198
      CONTROL_API_SIGNING_WORKLOAD_CREDENTIAL_ID: 018f0000-0000-7000-8000-000000000195
      CONTROL_API_EVIDENCE_ENVIRONMENT_ID: local
      CONTROL_API_IDENTITY_INTERNAL_TOKEN_FILE: /run/secrets/identity_internal_token
      CONTROL_API_LOCAL_PRIVACY_DOMAIN_ID: "${OPENPC_LOCAL_BOOTSTRAP_PRIVACY_DOMAIN_ID:-018f0000-0000-7000-8000-000000000201}"
      CONTROL_API_LISTEN: 0.0.0.0:3003
    secrets: [policy_fact_db_password, policy_fact_verify_key, runtime_analysis_target_keys, runtime_agent_projection_public_key, fleet_deployment_rejection_public_key, identity_continuation_public_key, control_api_runtime_db_password, fact_internal_token, identity_internal_token, identity_runtime_signing_public_key, business_provider_ca, business_api_cert, business_api_key, identity_mtls_ca]
    volumes:
      - "${OPENPC_LOCAL_DATA_ROOT:?}/module-releases:/app/module-releases:ro"
      - "${OPENPC_LOCAL_DATA_ROOT:?}/privacy-explorer:/app/privacy-explorer-fixture:ro"
      - "${OPENPC_LOCAL_DATA_ROOT:?}/protected-proofs:/app/protected-proofs:ro"
    depends_on:
      signing-provider: { condition: service_healthy }
      control-migrate: { condition: service_completed_successfully }
      identity-service: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 256
    networks: [openpc-local]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-worker:
    image: openpc-r1-dev/control-worker:local
    env_file:
      - path: "${OPENPC_LOCAL_DATA_ROOT:?}/fact-bridge/worker.env"
        required: false
    build:
      labels:
        io.openpc.image.owner: openpc-r1-local-runtime-v1
        io.openpc.image.service: control-worker
      context: ../../..
      dockerfile: services/fleet-controller/Dockerfile
      network: host
      entitlements: [network.host]
    platform: linux/amd64
    environment:
      OPENPC_LOCAL_RUNTIME: "1"
      CONTROL_WORKER_DATABASE_HOST: control-pg
      CONTROL_WORKER_DATABASE_PORT: "5432"
      CONTROL_WORKER_DATABASE_NAME: openpc_control
      CONTROL_WORKER_DATABASE_USER: openpc_local_control_worker
      CONTROL_WORKER_DATABASE_PASSWORD_FILE: /run/secrets/control_worker_runtime_db_password
      CONTROL_WORKER_PARTICIPANT_ID: 018f0000-0000-7000-8000-000000000101
      CONTROL_WORKER_PRIVACY_DOMAIN_ID: "${OPENPC_LOCAL_BOOTSTRAP_PRIVACY_DOMAIN_ID:-018f0000-0000-7000-8000-000000000201}"
      CONTROL_WORKER_ID: local-control-worker-1
      OPENPC_TARGET_WITHDRAWAL_PRE_SIGN_RETRY_MS: "${OPENPC_TARGET_WITHDRAWAL_PRE_SIGN_RETRY_MS:-1000}"
      OPENPC_CIGL_ANALYSIS_TARGET_KEYS_FILE: /run/secrets/runtime_analysis_target_keys
      OPENPC_MANAGED_DEPLOYMENT_ENABLED: "${OPENPC_MANAGED_DEPLOYMENT_ENABLED:-false}"
      CONTROL_WORKER_DEPLOYMENT_IDENTITY_URL: https://identity-service:3443/
      CONTROL_WORKER_DEPLOYMENT_TARGET_URL: https://runtime-envoy:18545/
      CONTROL_WORKER_DEPLOYMENT_TARGET_ID: "${OPENPC_LOCAL_TARGET_ID:-unconfigured}"
      CONTROL_WORKER_DEPLOYMENT_RESULT_ROOT: /runtime
      CONTROL_WORKER_DEPLOYMENT_CA_FILE: /run/secrets/identity_mtls_ca
      CONTROL_WORKER_DEPLOYMENT_CERT_FILE: /run/secrets/identity_mtls_rotated_cert
      CONTROL_WORKER_DEPLOYMENT_KEY_FILE: /run/secrets/identity_mtls_rotated_key
      CONTROL_WORKER_SIGNING_PROVIDER_URL: https://signing-provider:3007
      CONTROL_WORKER_SIGNING_CREDENTIAL_ID: 018f0000-0000-7000-8000-000000000198
      CONTROL_WORKER_SIGNING_PROVIDER_CA_FILE: /run/secrets/business_provider_ca
      CONTROL_WORKER_SIGNING_PROVIDER_CERT_FILE: /run/secrets/business_worker_cert
      CONTROL_WORKER_SIGNING_PROVIDER_KEY_FILE: /run/secrets/business_worker_key
      CONTROL_WORKER_ARTIFACT_CAPACITY_BYTES: "1048576"
      CONTROL_WORKER_FLEET_SIGNING_SECRET_FILE: /run/secrets/fleet_controller_signing_secret
      CONTROL_WORKER_FACT_ADMISSION_KEY_FILE: /run/secrets/fleet_fact_admission_key
      CONTROL_WORKER_TARGET_DISPOSITION_KEY_FILE: /run/secrets/runtime_target_disposition_key
      CONTROL_WORKER_FACT_FAILURE_SIGNING_KEY_FILE: /run/secrets/fleet_fact_failure_signing_key
      CONTROL_WORKER_AGENT_SIGNING_SECRET_FILE: /run/secrets/runtime_agent_signing_secret
      CONTROL_WORKER_IDENTITY_RUNTIME_PUBLIC_KEY_FILE: /run/secrets/identity_runtime_signing_public_key
      CONTROL_WORKER_FACT_DATABASE_HOST: fact-pg
      CONTROL_WORKER_FACT_DATABASE_PORT: "5432"
      CONTROL_WORKER_FACT_DATABASE_NAME: openpc_facts
      CONTROL_WORKER_FACT_DATABASE_USER: openpc_policy_fact_runtime
      CONTROL_WORKER_FACT_DATABASE_PASSWORD_FILE: /run/secrets/policy_fact_db_password
      CONTROL_WORKER_FACT_VERIFY_KEY_FILE: /run/secrets/policy_fact_verify_key
      CONTROL_WORKER_FACT_VERIFY_KEY_ID: sha256:6bd1b7ff42169210dab9f9a28055f450b422a47834ff4e68e8c2de9d54804efc
      CONTROL_WORKER_ADS_LISTEN: 0.0.0.0:18000
      CONTROL_WORKER_ADS_SERVER_CERT_FILE: /run/secrets/runtime_ads_server_cert
      CONTROL_WORKER_ADS_SERVER_KEY_FILE: /run/secrets/runtime_ads_server_key
      CONTROL_WORKER_ADS_CLIENT_CA_FILE: /run/secrets/runtime_ads_ca
      CONTROL_WORKER_TARGET_CLIENT_CERT_FILE: /runtime/tls/ads-client.pem
      CONTROL_WORKER_PROTECTED_BIND: 0.0.0.0
      CONTROL_WORKER_PROTECTED_PORT: "18545"
      CONTROL_WORKER_PDS_SOCKET: /runtime/ipc/pds.sock
      CONTROL_WORKER_BROKER_SOCKET: /runtime/ipc/broker.sock
      CONTROL_WORKER_PROTECTED_CERT_FILE: /runtime/tls/protected-server.pem
      CONTROL_WORKER_PROTECTED_KEY_FILE: /runtime/tls/protected-server.key
      CONTROL_WORKER_WORKLOAD_CA_FILE: /runtime/tls/workload-ca.pem
      OPENPC_PROVIDER_SOURCE_DIRECTORY: /provider-sources
      OPENPC_RUNTIME_CONFIGURATION_INPUT_FILE: /provider-sources/runtime-configuration.cbor
      OPENPC_PROVIDER_PROBE_JOURNAL_DIRECTORY: /provider-journal/owner
      OPENPC_LOCAL_PROVIDER_PROFILE_FILE: /provider-sources/profile.json
    volumes:
      - "${OPENPC_LOCAL_DATA_ROOT:?}/fact-bridge/manager-url:/fact-manager-url:ro"
      - "${OPENPC_LOCAL_DATA_ROOT:?}/provider-probe-source:/provider-sources:ro"
