                limits: {cpu: "OPENPC_INPUT_RESOURCES_CONTROL_CPU_LIMIT", memory: "OPENPC_INPUT_RESOURCES_CONTROL_MEMORY_LIMIT", ephemeral-storage: "OPENPC_INPUT_RESOURCES_CONTROL_EPHEMERAL_STORAGE_LIMIT"}
