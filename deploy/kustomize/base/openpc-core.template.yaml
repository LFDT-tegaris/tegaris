# Exact Kubernetes 1.36.2 template. Every OPENPC_INPUT_* token is a required,
# typed binding from materialization-inputs.schema.json. A rendered manifest
# containing any token is invalid and must not be applied or claimed deployed.
apiVersion: v1
kind: List
metadata:
  name: openpc-core
  annotations:
    openpc.io/freeze-id: C03-ARCHITECTURE-SHARED-PRIMITIVES-FREEZE-20260824-01
    openpc.io/qualification-receipt-digest: "OPENPC_INPUT_QUALIFICATION_RECEIPT_DIGEST"
items:
