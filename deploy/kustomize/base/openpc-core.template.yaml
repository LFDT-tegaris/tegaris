        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.36
        openpc.io/profile: "OPENPC_INPUT_PROFILE"
  - apiVersion: v1
    kind: ServiceAccount
    metadata: {name: openpc-workbench, namespace: "OPENPC_INPUT_NAMESPACE"}
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ServiceAccount
    metadata: {name: openpc-control, namespace: "OPENPC_INPUT_NAMESPACE"}
    automountServiceAccountToken: false
  - apiVersion: v1
