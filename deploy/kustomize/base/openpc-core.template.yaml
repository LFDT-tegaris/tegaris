              lifecycle: {preStop: {httpGet: {path: /lifecycle/drain, port: https, scheme: HTTPS}}}
              volumeMounts: [{name: tmp, mountPath: /tmp}, {name: secret-provider, mountPath: /run/openpc/secrets, readOnly: true}]
          volumes:
