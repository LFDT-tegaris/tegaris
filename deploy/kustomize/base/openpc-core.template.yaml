    spec:
      replicas: OPENPC_INPUT_TOPOLOGY_WORKBENCH_REPLICAS
      minReadySeconds: OPENPC_INPUT_TOPOLOGY_MIN_READY_SECONDS
      strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
      selector: {matchLabels: {app.kubernetes.io/name: openpc-workbench}}
      template:
        metadata: {labels: {app.kubernetes.io/name: openpc-workbench, openpc.io/du: DU-PC-WORKBENCH}}
        spec:
          serviceAccountName: openpc-workbench
          automountServiceAccountToken: false
          topologySpreadConstraints:
            - {maxSkew: 1, topologyKey: "OPENPC_INPUT_TOPOLOGY_KEY", whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: openpc-workbench}}}
          terminationGracePeriodSeconds: OPENPC_INPUT_TOPOLOGY_TERMINATION_GRACE_SECONDS
          securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: workbench
              image: "OPENPC_INPUT_IMAGES_WORKBENCH"
              imagePullPolicy: IfNotPresent
              ports: [{name: https, containerPort: 8443, protocol: TCP}]
              env: [{name: OPENPC_PROFILE, value: "OPENPC_INPUT_PROFILE"}]
              securityContext: {allowPrivilegeEscalation: false, privileged: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              resources:
                requests: {cpu: "OPENPC_INPUT_RESOURCES_WORKBENCH_CPU_REQUEST", memory: "OPENPC_INPUT_RESOURCES_WORKBENCH_MEMORY_REQUEST", ephemeral-storage: "OPENPC_INPUT_RESOURCES_WORKBENCH_EPHEMERAL_STORAGE_REQUEST"}
