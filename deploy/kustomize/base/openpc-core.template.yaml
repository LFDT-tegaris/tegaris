              startupProbe: {httpGet: {path: /health/startup, port: https, scheme: HTTPS}, periodSeconds: 2, failureThreshold: 150, timeoutSeconds: 1}
              readinessProbe: {httpGet: {path: /health/readiness, port: https, scheme: HTTPS}, periodSeconds: 5, failureThreshold: 2, timeoutSeconds: 2}
              livenessProbe: {httpGet: {path: /health/liveness, port: https, scheme: HTTPS}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 2}
              lifecycle: {preStop: {httpGet: {path: /lifecycle/drain, port: https, scheme: HTTPS}}}
              volumeMounts: [{name: tmp, mountPath: /tmp}]
          volumes: [{name: tmp, emptyDir: {medium: Memory, sizeLimit: "OPENPC_INPUT_RESOURCES_WORKBENCH_EPHEMERAL_STORAGE_LIMIT"}}]
