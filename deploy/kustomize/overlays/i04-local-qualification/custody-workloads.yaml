apiVersion: v1
kind: ConfigMap
metadata:
  name: openpc-i04-signer-api-ca
data:
  ca.pem: PENDING_LOCAL_SIGNER_STARTUP_PUBLIC_CERTIFICATE
---
apiVersion: v1
kind: Pod
metadata:
  name: openpc-i04-qualification-signer
  labels:
    app.kubernetes.io/name: openpc-i04-qualification-signer
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  hostIPC: false
  hostNetwork: false
  hostPID: false
  restartPolicy: Never
  serviceAccountName: openpc-i04-qualification-signer
  securityContext:
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: offline-provisioner
      image: openpc/i04-custody-provisioner:r8-length-delimited
      imagePullPolicy: Never
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        privileged: false
        readOnlyRootFilesystem: true
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      volumeMounts:
        - name: custody
          mountPath: /custody
        - name: signer-kubernetes-api
          mountPath: /var/run/openpc/k8s-api
          readOnly: true
        - name: scratch
          mountPath: /tmp
  containers:
    - name: purpose-signer
      image: openpc/i04-custody-signer:r8-length-delimited
      imagePullPolicy: Never
      ports:
        - name: https
          containerPort: 8443
      readinessProbe:
        tcpSocket:
          port: https
        initialDelaySeconds: 1
        periodSeconds: 1
        failureThreshold: 60
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        privileged: false
        readOnlyRootFilesystem: true
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      volumeMounts:
        - name: custody
          mountPath: /custody
        - name: signer-kubernetes-api
          mountPath: /var/run/openpc/k8s-api
          readOnly: true
        - name: scratch
          mountPath: /tmp
  volumes:
    - name: custody
      persistentVolumeClaim:
        claimName: openpc-i04-local-custody
    - name: signer-kubernetes-api
      projected:
        defaultMode: 0400
        sources:
          - serviceAccountToken:
              path: token
              audience: https://kubernetes.default.svc.cluster.local
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
    - name: scratch
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openpc-i04-qualification-signer
spec:
  selector:
    app.kubernetes.io/name: openpc-i04-qualification-signer
  ports:
    - name: https
      port: 8443
      targetPort: https
