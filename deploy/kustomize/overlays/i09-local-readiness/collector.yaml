apiVersion: v1
kind: ServiceAccount
metadata:
  name: openpc-i09-otel
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openpc-i09-otel
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openpc-i09-otel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openpc-i09-otel
        openpc.io/otlp-producer: "true"
    spec:
      serviceAccountName: openpc-i09-otel
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/openpc/collector.yaml"]
          ports:
            - {name: otlp-http, containerPort: 4318, protocol: TCP}
            - {name: health, containerPort: 13133, protocol: TCP}
          startupProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: config, mountPath: /etc/openpc, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: openpc-i09-otel-config
        - name: scratch
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: openpc-i09-otel
spec:
  selector:
    app.kubernetes.io/name: openpc-i09-otel
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
