packages:
  - apps/*
  - packages/*
  - services/control-api
  - services/identity-service
  - services/participant-service
  - services/module-registry
autoInstallPeers: false
engineStrict: true
ignoreScripts: true
nodeLinker: isolated
enableGlobalVirtualStore: false
pmOnFail: error
preferFrozenLockfile: true
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true
verifyStoreIntegrity: true
# A normal run/exec must not silently install or ask to repair stale dependencies.
verifyDepsBeforeRun: error
allowBuilds:
  cpu-features: false
  esbuild: false
  msw: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.7'
  - '@tanstack/react-query@5.102.7'
  - '@tanstack/react-table@9.2.3'
  - '@tanstack/table-core@9.2.3'
