asyncapi: 3.0.0
info:
  title: OpenPC logical event contracts
  version: 1.0.0
  description: Logical PostgreSQL transactional-outbox channels, CloudEvents 1.0.2 structured envelopes, fleet receipt streams,
    and same-origin SSE projection. No external message broker is an R1 correctness authority.
defaultContentType: application/cloudevents+json
servers:
  controlOutbox:
    host: control-postgresql
    protocol: postgresql-outbox
    protocolVersion: '1.0'
    description: Logical transactional outbox; transport optimization cannot replace the database commit boundary.
  fleetStream:
    host: pc-fleet-control
    protocol: grpc
    protocolVersion: proto3
    description: mTLS bidirectional desired-generation/receipt stream.
  sameOriginSse:
    host: same-origin
    pathname: /api/v1/events
    protocol: https
    protocolVersion: SSE
    description: Authorized snapshot-plus-events UI projection.
channels:
  controlWork:
    address: openpc.control.work.v1
    messages:
      CommandCommitted:
        $ref: '#/components/messages/CommandCommitted'
      SecretRevoked:
        $ref: '#/components/messages/SecretRevoked'
      SecretRotated:
        $ref: '#/components/messages/SecretRotated'
    x-openpc-ordering-key: participantId+aggregateRef
    x-openpc-delivery: AT_LEAST_ONCE_TRANSACTIONAL_OUTBOX_AND_IDEMPOTENT_INBOX
    x-openpc-deduplication: event id; same id+same datadigest is no-op; same id+different datadigest is tamper/conflict and
      quarantines the stream scope
    x-openpc-sequence: Monotonic per ordering key; a gap blocks completeness and starts replay or reconciliation before subsequent
      effects
    x-openpc-replay: Resume from durable per-consumer cursor; each effect is reauthorized against current authority and event-bound
      generation
    x-openpc-backpressure: Stop lease/ack advancement before capacity exhaustion; retain source truth; surface work item;
      never drop or convert to success/empty
    x-openpc-trace:
      requirementIds:
      - REQ-SR01-B0-REQ-TARCH-COM-003
      decisionIds:
      - AD-SR04-001-B0-FREEZE
      - AD-SR04-004-AUTHORITY-INTERSECTION
      - AD-SR04-014-SECURITY-OPERATIONS
      - AD-SR04-015-UI-TRUTH-NOT-AUTHORITY
      componentIds:
      - LS-CONTROL-API
