[package]
name = "openpc-fact-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum.workspace = true
base64ct = { workspace = true, features = ["alloc"] }
ciborium.workspace = true
hmac.workspace = true
openpc-indexer-adapter = { path = "../indexer-adapter" }
openpc-multi-rpc = { path = "../multi-rpc" }
openpc-pds = { path = "../pds" }
p256 = { workspace = true, features = ["ecdsa", "getrandom"] }
pc-evidence = { path = "../../crates/pc-evidence" }
pc-facts-core = { path = "../../crates/pc-facts-core" }
pc-provider-api = { path = "../../crates/pc-provider-api" }
pc-policy-core = { path = "../../crates/pc-policy-core" }
pc-runtime-types = { path = "../../crates/pc-runtime-types" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "uuid"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["serde"] }
zeroize.workspace = true
