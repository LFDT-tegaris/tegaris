[package]
name = "openpc-multi-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
pc-policy-core = { path = "../../crates/pc-policy-core" }
pc-runtime-types = { path = "../../crates/pc-runtime-types" }
ciborium.workspace = true
pc-provider-api = { path = "../../crates/pc-provider-api" }
reqwest.workspace = true
rustls = { workspace = true, features = ["ring"] }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha2.workspace = true
sha3.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "test-util", "time"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
