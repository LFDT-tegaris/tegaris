specVersion: 1.3.0
description: OpenPC deterministic local event-only fixture
features:
  - fullTextSearch
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: LocalToken
    network: openpc-local
    source:
      address: '0x1111111111111111111111111111111111111111'
      abi: LocalToken
      startBlock: 16
      endBlock: 16
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: LocalToken
          file: ./abis/LocalToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
